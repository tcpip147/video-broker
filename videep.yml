# 입력 스트림의 RTSP 주소와 프로토콜
input:
  rtsp:
    url: rtsp://210.99.70.120:1935/live/cctv001.stream
    transport: tcp

# 출력 스트림의 RTSP 주소와 프로토콜
output:
  rtsp:
    url: rtsp://localhost:8554/cctv001
    transport: tcp

# 파이프라인 백엔드: cpu 또는 cuda
backend: cpu
inference_interval: 3

# 프레임을 받아서 처리하는 python 파일 경로
# 공통적으로 on_frame 함수는 이미지 합성까지 처리 후 하나의 완성된 프레임을 반환해야 합니다.
# backend가 cuda인 경우, on_frame 함수는 GPU 상주 메모리에서 처리되어야 합니다.
model: examples/inference_cpu.py
